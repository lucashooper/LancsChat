<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset your LancsChat account</title>
</head>
<body style="margin: 0; padding: 0; background-color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #000000; min-height: 100vh;">
    <tr>
      <td align="center" style="padding: 40px 20px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 480px; background-color: #000000;">
          
          <!-- Logo -->
          <tr>
            <td align="center" style="padding-bottom: 32px;">
              <img src="https://i.imgur.com/hR77VPS.png" alt="Lancaster University" width="48" height="48" style="border-radius: 12px; border: 1px solid #262626;" />
            </td>
          </tr>

          <!-- Card -->
          <tr>
            <td style="background-color: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 16px; padding: 40px 36px;">
              
              <!-- Title -->
              <h1 style="margin: 0 0 8px 0; font-size: 24px; font-weight: 700; color: #fafafa; text-align: center; letter-spacing: -0.3px;">
                Reset Your Account
              </h1>
              <p style="margin: 0 0 24px 0; font-size: 14px; color: #a8a8a8; text-align: center; line-height: 22px;">
                Click the button below to reset your account access. This link will expire in 1 hour.
              </p>

              <!-- Button -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center">
                    <a href="{{ .ConfirmationURL }}" style="display: block; width: 100%; max-width: 280px; margin: 0 auto 24px; padding: 14px 24px; background-color: #0095f6; color: #ffffff; text-decoration: none; border-radius: 10px; font-weight: 600; font-size: 15px; text-align: center; transition: background-color 0.2s;">
                      Reset Account
                    </a>
                  </td>
                </tr>
              </table>

              <!-- Divider -->
              <hr style="border: none; border-top: 1px solid #1a1a1a; margin: 28px 0;" />

              <!-- Info text -->
              <p style="margin: 0; font-size: 13px; color: #525252; text-align: center; line-height: 20px;">
                If you didn't request an account reset, you can safely ignore this email. Your account will remain unchanged.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding-top: 24px; text-align: center;">
              <p style="margin: 0 0 4px 0; font-size: 13px; font-weight: 600; color: #404040; letter-spacing: -0.2px;">
                LancsChat
              </p>
              <p style="margin: 0; font-size: 11px; color: #333333; line-height: 18px;">
                Anonymous chat for Lancaster University students
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
